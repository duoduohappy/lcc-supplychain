<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

  <title>AirBridge · LCC Supply Chain Demo</title>
  <style>
    :root{--bg:#f3f5f9;--panel:#fff;--ink:#182235;--muted:#748098;--line:#e7ebf2;--nav:#101b2d;--teal:#12a899;--teal2:#e4f8f4;--blue:#5275e8;--amber:#e4a434;--red:#db6268;--shadow:0 8px 24px #1a27400b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0}.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}.side{background:var(--nav);color:#d8e0ef;padding:24px 15px;display:flex;flex-direction:column;gap:28px}.brand{display:flex;gap:11px;align-items:center;padding:4px 8px}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#41d6c2,#547cf5);display:grid;place-items:center;color:#fff;font-weight:800}.brand b{font-size:16px;color:white;letter-spacing:.2px}.brand small{display:block;color:#8c9ab0;font-size:10px}.label{font-size:10px;letter-spacing:1.2px;color:#77859e;padding:0 11px;margin-bottom:-18px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#9eabc0;text-align:left;padding:11px 12px;border-radius:9px;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:#202e45;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--teal)}.nav i{width:17px;text-align:center;font-style:normal}.sidefoot{margin-top:auto;border:1px solid #ffffff16;border-radius:12px;padding:13px;color:#aab6c9;font-size:11px}.sidefoot b{color:#fff;display:block;margin-bottom:4px}.main{min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:2}.crumb{color:var(--muted);font-size:12px}.crumb b{color:var(--ink);font-weight:600}.topright{display:flex;gap:9px;align-items:center}.badge{border-radius:20px;background:#fff5df;color:#a97313;padding:5px 9px;font-size:11px}.avatar{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#e8edff;color:#526cce;font-weight:700}.content{padding:27px 30px 45px;max-width:1500px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}.pagehead h1{font-size:22px;margin:0 0 5px}.pagehead p{margin:0;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px}.btn{padding:9px 13px;border-radius:8px;background:#edf0f6;color:#4f5d76;font-size:12px}.btn:hover{filter:brightness(.97)}.btn.primary{background:var(--teal);color:#fff}.btn.blue{background:#edf0ff;color:#536ddd}.btn.dark{background:#202d42;color:#fff}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px 18px;box-shadow:var(--shadow)}.stat{display:flex;justify-content:space-between;align-items:flex-start}.stat .k{font-size:11px;color:var(--muted)}.stat .v{font-size:25px;font-weight:700;letter-spacing:-.5px;margin:7px 0 3px}.stat .delta{font-size:10px;color:var(--teal)}.staticon{width:33px;height:33px;border-radius:10px;display:grid;place-items:center;background:var(--teal2);color:var(--teal)}.twocol{grid-template-columns:minmax(0,1.55fr) minmax(300px,.9fr)}.threecol{grid-template-columns:repeat(3,minmax(0,1fr))}.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.cardhead h2{font-size:14px;margin:0}.cardhead span{font-size:10px;color:var(--muted)}.flow{display:flex;gap:7px;align-items:center;overflow:auto;padding:13px 2px 8px}.step{flex:1;min-width:100px;border:1px solid var(--line);border-radius:10px;padding:11px 10px;background:#fff}.step em{font-style:normal;color:var(--teal);font-size:10px}.step b{display:block;font-size:11px;margin:4px 0}.step small{color:var(--muted);font-size:9px}.arrow{color:#a6afbd}.feed{display:grid;gap:12px}.feedrow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center}.feedicon{width:29px;height:29px;border-radius:9px;background:#eef1ff;display:grid;place-items:center;color:var(--blue)}.feedrow b{font-size:11px;display:block}.feedrow small{display:block;color:var(--muted);font-size:10px}.feedrow time{color:var(--muted);font-size:9px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th{text-align:left;font-size:10px;color:#8a95a8;font-weight:500;padding:9px 10px;border-bottom:1px solid var(--line)}td{font-size:11px;padding:11px 10px;border-bottom:1px solid #f0f2f6}tbody tr:last-child td{border-bottom:0}.pill{display:inline-flex;border-radius:20px;padding:3px 8px;font-size:9px;background:#eef1f7;color:#58657b}.pill.good{color:#11836f;background:#e1f7ef}.pill.warn{color:#a56d13;background:#fff3db}.pill.bad{color:#bd444a;background:#ffeded}.pill.blue{color:#4b66c6;background:#edf0ff}.positive{color:#098b72}.negative{color:#cf555c}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:13px;flex-wrap:wrap}.field{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:11px}.field:focus{outline:2px solid #b8eee7}.small{font-size:10px;color:var(--muted)}.chart{height:200px;width:100%;display:block}.legend{display:flex;gap:14px;color:var(--muted);font-size:10px}.legend span:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-right:5px}.legend span:nth-child(2):before{background:#abb7cb}.metricline{display:flex;gap:22px;align-items:baseline}.metricline strong{font-size:22px}.metricline small{color:var(--muted);font-size:10px}.strategy{border:1px solid var(--line);padding:13px;border-radius:10px}.strategy b{font-size:12px}.strategy p{font-size:10px;color:var(--muted);margin:6px 0 10px}.range{width:100%;accent-color:var(--teal)}.agent{display:grid;grid-template-columns:1fr 300px;gap:15px}.chat{display:flex;flex-direction:column;min-height:490px}.messages{display:flex;flex-direction:column;gap:13px;flex:1;overflow:auto;padding:5px 0 16px}.msg{max-width:82%;padding:11px 13px;border-radius:12px;background:#f3f5f9;font-size:11px;white-space:pre-wrap}.msg.user{align-self:flex-end;background:#e4f7f4}.msg b{display:block;margin-bottom:5px}.chatbar{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px}.chatbar input{flex:1;min-width:0}.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.quick button{background:#f4f6fa;color:#56647b;border-radius:20px;padding:6px 9px;font-size:9px}.trace{font-family:ui-monospace,Consolas,monospace;font-size:9px;color:#5c6b80;display:grid;gap:7px}.trace div{padding:7px 8px;background:#f5f7fb;border-radius:6px}.trace b{color:var(--teal)}.alert{border-left:3px solid var(--amber);padding:9px 11px;background:#fff9ec;color:#78591e;font-size:10px;border-radius:0 7px 7px 0}.hidden{display:none!important}.toast{position:fixed;bottom:20px;right:22px;background:#17243a;color:#fff;border-radius:9px;padding:11px 15px;box-shadow:var(--shadow);font-size:11px;z-index:10;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.tabs{display:flex;gap:7px;border-bottom:1px solid var(--line);margin-bottom:14px}.tabs button{padding:9px 11px;background:transparent;color:var(--muted);font-size:11px;border-bottom:2px solid transparent}.tabs button.active{color:var(--teal);border-color:var(--teal)}.riskbox{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.riskbox div{background:#f6f8fb;border-radius:9px;padding:10px}.riskbox small{display:block;font-size:9px;color:var(--muted)}.riskbox strong{font-size:13px}.modalback{position:fixed;inset:0;background:#10182788;display:grid;place-items:center;z-index:5;padding:20px}.modal{max-width:480px;width:100%;background:#fff;border-radius:14px;padding:21px}.modal h3{margin:0 0 8px}.modal p{font-size:11px;color:var(--muted);line-height:1.7}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.twocol,.agent{grid-template-columns:1fr}.agent aside{order:-1}}@media(max-width:700px){.shell{grid-template-columns:62px 1fr}.side{padding:18px 8px}.brand{padding:0;justify-content:center}.brand div:last-child,.label,.nav button span,.sidefoot{display:none}.nav button{justify-content:center;padding:12px 5px}.top{padding:0 14px}.content{padding:20px 13px}.pagehead{display:block}.actions{margin-top:13px}.stats{gap:8px}.card{padding:13px}.stat .v{font-size:20px}.threecol{grid-template-columns:1fr}.tablewrap table{min-width:680px}}
  </style>
</head>
<body>
<div class="shell">
 <aside class="side"><div class="brand"><div class="logo">A</div><div><b>AirBridge</b><small>SUPPLY CHAIN LAB</small></div></div><div class="label">WORKSPACE</div>
  <nav class="nav" id="nav">
   <button data-page="overview" class="active"><i>◫</i><span>经营总览</span></button>
   <button data-page="supply"><i>⇄</i><span>航司供应链</span></button>
   <button data-page="siaNdc"><i>✈</i><span>新航 NDC</span></button>
   <button data-page="pricing"><i>⌁</i><span>比价与定价</span></button>
   <button data-page="trading"><i>▤</i><span>量化策略</span></button>
   <button data-page="finance"><i>◷</i><span>业财对账</span></button>
   <button data-page="copilot"><i>✳</i><span>交易 Copilot</span></button>
  </nav>
  <div class="sidefoot"><b>演示环境 · Mock Mode</b>所有报价、订单与资金均为可重复的模拟数据。出票及自动改价已关闭。</div>
 </aside>
 <main class="main"><header class="top"><div class="crumb">AirBridge <span> / </span><b id="crumb">经营总览</b></div><div class="topright"><span class="badge">● MOCK DATA</span><div class="avatar">李</div></div></header><div class="content" id="content"></div></main>
</div><div class="toast" id="toast"></div>
<script>
const names={overview:'经营总览',supply:'航司供应链',siaNdc:'新航 NDC',pricing:'比价与定价',trading:'量化策略',finance:'业财对账',copilot:'交易 Copilot'};
const siaApiBase=(document.querySelector('meta[name="sia-api-base"]')?.content||'').trim().replace(/\/$/,'');
const providers=[
 {id:'ND-1028',name:'NorthStar NDC Sandbox',type:'NDC Mock',region:'东北亚',health:'正常',latency:238,coverage:'航班 / 订单 / 退改'},
 {id:'LC-2041',name:'BlueSky LCC API',type:'LCC Partner Mock',region:'中国 / 东南亚',health:'正常',latency:311,coverage:'航班 / 行李 / 订单'},
 {id:'AG-0031',name:'票务代理聚合源',type:'Aggregator Mock',region:'全球',health:'延迟偏高',latency:1240,coverage:'报价 / 订单查询'}
];
const baseOffers=[
 {id:'OF-78021',supplier:'NorthStar NDC Sandbox',airline:'青岚航空',flight:'QL 812',route:'PEK → KIX',depart:'06:35',arrive:'10:05',seats:4,cabin:'经济舱',base:1380,fee:65,baggage:'20kg',refundable:false},
 {id:'OF-78022',supplier:'BlueSky LCC API',airline:'海风航空',flight:'SF 206',route:'PEK → KIX',depart:'08:10',arrive:'11:35',seats:7,cabin:'经济舱',base:1120,fee:145,baggage:'无',refundable:false},
 {id:'OF-78023',supplier:'票务代理聚合源',airline:'远航航空',flight:'YH 310',route:'PEK → KIX',depart:'12:20',arrive:'15:50',seats:2,cabin:'经济舱',base:1510,fee:40,baggage:'23kg',refundable:true},
 {id:'OF-78024',supplier:'BlueSky LCC API',airline:'海风航空',flight:'SF 208',route:'PEK → KIX',depart:'15:45',arrive:'19:10',seats:3,cabin:'经济舱',base:1260,fee:95,baggage:'10kg',refundable:false},
 {id:'OF-78025',supplier:'NorthStar NDC Sandbox',airline:'青岚航空',flight:'QL 816',route:'PEK → KIX',depart:'19:30',arrive:'23:00',seats:6,cabin:'经济舱',base:1450,fee:35,baggage:'20kg',refundable:true}
];
let offers=structuredClone(baseOffers),strategy='balanced',margin=8,orders=JSON.parse(localStorage.getItem('airbridge-orders')||'[]'),page='overview',chat=[];
const money=n=>'¥'+Number(n).toLocaleString('zh-CN',{maximumFractionDigits:0});const pct=n=>`${Number(n).toFixed(1)}%`;
function quote(o){let factor={balanced:1.08,volume:1.045,margin:1.12}[strategy];return Math.round((o.base+o.fee)*factor*(1+margin/100-0.08))}
function save(){localStorage.setItem('airbridge-orders',JSON.stringify(orders))}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500)}
function pageHead(title,sub,buttons=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${buttons}</div></div>`}
function cardhead(a,b=''){return `<div class="cardhead"><h2>${a}</h2><span>${b}</span></div>`}
function pill(t,c=''){return `<span class="pill ${c}">${t}</span>`}
function btn(label,act,cls='btn'){return `<button class="${cls}" data-action="${act}">${label}</button>`}
function orderData(){return orders.map(o=>{let offer=baseOffers.find(x=>x.id===o.offerId)||baseOffers[0];return {...o,offer,margin:o.sell-o.cost-o.channelCost}})}
function stats(items){let booked=items.length,gmv=items.reduce((s,x)=>s+x.sell,0),gp=items.reduce((s,x)=>s+x.margin,0);return {booked,gmv,gp,rate:gmv?gp/gmv*100:0}}
function metric(label,val,delta,icon){return `<div class="card"><div class="stat"><div><div class="k">${label}</div><div class="v">${val}</div><div class="delta">${delta}</div></div><div class="staticon">${icon}</div></div></div>`}
function flow(){return `<div class="flow"><div class="step"><em>01 · SUPPLY</em><b>供应商适配</b><small>NDC / LCC / 聚合源</small></div><span class="arrow">→</span><div class="step"><em>02 · SHOP</em><b>报价归一化</b><small>总价 / 行李 / 退改</small></div><span class="arrow">→</span><div class="step"><em>03 · PRICE</em><b>策略建议</b><small>成本 + 规则 + 风险</small></div><span class="arrow">→</span><div class="step"><em>04 · ORDER</em><b>人工确认</b><small>幂等订单状态机</small></div><span class="arrow">→</span><div class="step"><em>05 · FINANCE</em><b>业财核算</b><small>收入 / 成本 / 毛利</small></div></div>`}
function chart(){let values=[36,45,39,58,52,67,63,75,68,82,77,91],w=640,h=180,p=10;let pts=values.map((v,i)=>`${p+i*(w-2*p)/(values.length-1)},${h-p-v*1.35}`).join(' ');let area=`${p},${h} ${pts} ${w-p},${h}`;return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#12a899" stop-opacity=".18"/><stop offset="1" stop-color="#12a899" stop-opacity="0"/></linearGradient></defs>${[40,80,120,160].map(y=>`<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="#edf0f5"/>`).join('')}<polygon points="${area}" fill="url(#fade)"/><polyline points="${pts}" fill="none" stroke="#12a899" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>`}
function renderOverview(){let s=stats(orderData());let latest=orderData().slice(-4).reverse();return `${pageHead('航空供应链经营总览','LCC Supply Chain · 订单、定价与业财模拟驾驶舱',btn('导出经营摘要','export','btn blue')+btn('运行供应商健康检查','health','btn primary'))}<section class="grid stats">${metric('今日成交订单',s.booked+' 笔','模拟订单 · 点击下单可更新','▣')}${metric('交易额 GMV',money(s.gmv),`模拟支付 · ${s.booked} 笔`,'↗')}${metric('预估毛利',money(s.gp),`毛利率 ${pct(s.rate)}`,'◈')}${metric('报价供应商',providers.length+' 家','2 个 NDC/LCC Mock + 1 聚合','⇄')}</section><section class="grid twocol"><div class="card">${cardhead('交易流程运行图','MOCK WORKFLOW')}${flow()}<div class="alert" style="margin-top:13px">演示边界：无真实航司凭证；出票/退票仅模拟。报价为本地种子数据，不代表实时市场价格。</div></div><div class="card">${cardhead('供应商接入健康','最近探测 · 模拟') }<div class="feed">${providers.map(p=>`<div class="feedrow"><div class="feedicon">⇄</div><div><b>${p.name}</b><small>${p.type} · ${p.coverage}</small></div><div>${pill(p.health,p.health==='正常'?'good':'warn')}<small style="text-align:right">${p.latency} ms</small></div></div>`).join('')}</div></div></section><section class="grid twocol" style="margin-top:15px"><div class="card">${cardhead('模拟交易额趋势','近 12 个周期')}<div class="legend"><span>模拟 GMV 指数</span><span>仅为演示曲线</span></div>${chart()}</div><div class="card">${cardhead('最近订单','点击“比价与定价”发起预订')}<div class="tablewrap"><table><thead><tr><th>订单号</th><th>航线</th><th>状态</th><th>售价</th></tr></thead><tbody>${latest.length?latest.map(o=>`<tr><td>${o.id}</td><td>${o.offer.route}</td><td>${pill(o.status,o.status==='出票成功'?'good':'warn')}</td><td>${money(o.sell)}</td></tr>`).join(''):`<tr><td colspan="4" class="small">暂无演示订单</td></tr>`}</tbody></table></div></div></section>`}
function renderSupply(){return `${pageHead('航司供应链','供应商适配层 · 统一报价与订单接口 · 当前全部为沙箱模拟',btn('探测全部供应商','health','btn blue')+btn('刷新报价样例','refresh','btn primary'))}<div class="grid threecol">${providers.map(p=>`<div class="card">${cardhead(p.type,p.id)}<b style="font-size:14px">${p.name}</b><p class="small">覆盖：${p.coverage}</p><div class="riskbox"><div><small>健康状态</small><strong>${pill(p.health,p.health==='正常'?'good':'warn')}</strong></div><div><small>响应时间</small><strong>${p.latency} ms</strong></div><div><small>区域</small><strong>${p.region}</strong></div></div><div class="alert" style="margin-top:12px">连接类型：${p.type.includes('Mock')?'本地模拟适配器':'模拟聚合适配器'} · 凭证未配置</div></div>`).join('')}</div><div class="card" style="margin-top:15px">${cardhead('适配器契约','统一 Shop / Order / Service 边界')}<div class="tablewrap"><table><thead><tr><th>能力</th><th>输入</th><th>输出</th><th>状态</th></tr></thead><tbody><tr><td>Shop Offers</td><td>OD、日期、旅客、舱等</td><td>Offer[] + fare conditions + TTL</td><td>${pill('Mock 可用','good')}</td></tr><tr><td>Reprice</td><td>Offer ID + 当前上下文</td><td>最新价格、座位与失效原因</td><td>${pill('Mock 可用','good')}</td></tr><tr><td>Create Order</td><td>已确认 Offer + 旅客摘要</td><td>Order ID / PNR / ticket status</td><td>${pill('仅模拟','warn')}</td></tr><tr><td>Service / Refund</td><td>Order ID + 操作原因</td><td>变更记录与应退金额</td><td>${pill('规划中','')}</td></tr></tbody></table></div><p class="small">NDC 是购物、订单创建、订单服务、支付/退款的接口标准；标准开放不代表已获航司生产访问权限。</p></div>`}
function renderSiaNdc(){return `${pageHead('新加坡航空 · NDC Sandbox','IATA NDC 21.3 · 当前只实现 AirShopping 搜索；不创建订单、不支付、不出票',btn('检查后端状态','sia-status','btn blue'))}<div class="grid twocol"><div class="card">${cardhead('单程航班搜索','测试数据/实时性由新航 Sandbox 环境决定')}<div class="toolbar"><label class="small">出发<input id="siaOrigin" class="field" value="SIN" maxlength="3" aria-label="出发机场 IATA 代码"></label><span>→</span><label class="small">到达<input id="siaDestination" class="field" value="BKK" maxlength="3" aria-label="到达机场 IATA 代码"></label><label class="small">日期<input id="siaDate" class="field" type="date" value="2027-01-20"></label><label class="small">成人<input id="siaPax" class="field" type="number" min="1" max="9" value="1"></label></div><button id="siaSearch" class="btn primary" data-action="sia-search">调用 AirShopping</button><p class="small" style="margin-top:12px">仅发送机场代码、日期和成人数量。订单创建、乘客姓名、证件、支付和出票功能尚未开放。</p></div><div class="card">${cardhead('连接状态','密钥只存在后端')}<div id="siaStatus" class="alert">正在检查后端配置…</div><p class="small" style="margin-top:12px">GitHub Pages 是静态站点，无法运行后端。要调用航司测试接口，需要本地运行 Node 服务，或将后端部署到支持服务端密钥的托管环境。</p></div></div><div class="card" style="margin-top:15px">${cardhead('NDC 原始响应','AirShoppingRS · XML')}<pre id="siaResult" style="white-space:pre-wrap;overflow:auto;max-height:520px;background:#111b2d;color:#d8e0ef;border-radius:9px;padding:14px;font-size:11px">尚未发起请求。</pre></div><div class="alert" style="margin-top:15px">真实连接前提：新航批准的 Sandbox 账号、端点/认证参数，以及合作方分配的 Seller ID 和 Distributor ID。请勿将 API 密钥放在前端或提交到 GitHub。</div>`}
function renderPricing(){let sorted=[...offers].sort((a,b)=>a.base+a.fee-b.base-b.fee);return `${pageHead('比价与定价','展示含税费总价、行李与退改差异；建议价可解释、可审计',btn('重新搜索报价','refresh','btn blue')+btn('询价并生成策略建议','recommend','btn primary'))}<div class="grid twocol"><div class="card">${cardhead('查询条件','模拟航线')}<div class="toolbar"><input class="field" value="PEK" aria-label="出发机场"><span>→</span><input class="field" value="KIX" aria-label="到达机场"><input class="field" type="date" value="2026-12-12"><select class="field"><option>1 成人 · 经济舱</option></select></div><div class="alert">报价总价 = 基础票价 + 燃油/税费；会展示行李和退改条件，不能仅按裸票价排序。</div></div><div class="card">${cardhead('定价策略旋钮','当前策略：'+strategy)}<div class="toolbar"><select id="strategy" class="field"><option value="balanced" ${strategy==='balanced'?'selected':''}>平衡 · 推荐</option><option value="volume" ${strategy==='volume'?'selected':''}>走量 · 低毛利</option><option value="margin" ${strategy==='margin'?'selected':''}>毛利优先</option></select><label class="small">目标毛利 <b id="margindisplay">${margin}%</b></label></div><input id="margin" class="range" type="range" min="2" max="18" value="${margin}"><p class="small">策略只产生建议价，不写回供应商、不自动成交。硬约束：不低于供应成本 + 交易费；超限需人工确认。</p></div></div><div class="card" style="margin-top:15px">${cardhead('统一报价列表','报价 TTL：模拟 3 分钟 · 已按含费总价排序')}<div class="tablewrap"><table><thead><tr><th>航班 / 供应商</th><th>起降</th><th>座位</th><th>基础票价</th><th>税费</th><th>行李 / 退改</th><th>含费成本</th><th>建议售价</th><th>预估毛利</th><th></th></tr></thead><tbody>${sorted.map(o=>{let cost=o.base+o.fee,sell=quote(o),g=sell-cost-25;return `<tr><td><b>${o.airline} ${o.flight}</b><br><span class="small">${o.supplier}</span></td><td>${o.depart}–${o.arrive}<br><span class="small">${o.route}</span></td><td>${o.seats}</td><td>${money(o.base)}</td><td>${money(o.fee)}</td><td>${o.baggage}<br>${o.refundable?'可退':'不可退'}</td><td><b>${money(cost)}</b></td><td><b>${money(sell)}</b></td><td class="positive">${money(g)}</td><td>${btn('模拟预订','book:'+o.id,'btn primary')}</td></tr>`}).join('')}</tbody></table></div></div><div class="grid threecol" style="margin-top:15px"><div class="card">${cardhead('策略解释')}<b>${strategy==='balanced'?'平衡策略':strategy==='volume'?'走量策略':'毛利优先策略'}</b><p class="small">先保成本线，再结合目标毛利率生成建议价。不同票规/行李条件的报价先标准化，避免不可比。</p></div><div class="card">${cardhead('防护规则')}<div class="feed"><div>✓ 供应报价过期 → 阻断下单</div><div>✓ 成本异常或负毛利 → 禁止自动执行</div><div>✓ 供应商响应不一致 → 标记需复核</div></div></div><div class="card">${cardhead('为什么不是裸票价最低')}<p class="small">最低基础票价可能不含行李、支付费或退改权益。演示用同一组模拟票规对比总成本，并在预订前再次询价。</p></div></div>`}
function renderTrading(){let gross=12.4,draw=-4.8;return `${pageHead('量化策略工作台','离线模拟回测 · 仅评估定价规则，不连接真实资金或自动下单',btn('导出回测报告','export','btn blue')+btn('运行策略回测','backtest','btn primary'))}<div class="grid stats">${metric('策略版本','P-003','balanced · mock-v1','⌁')}${metric('样本订单','240','合成场景 / 60 天','▤')}${metric('毛利变化',`+${gross}%`,'相对固定加价基线','↗')}${metric('最大回撤',`${draw}%`,'按模拟日毛利计算','⌄')}</div><section class="grid twocol"><div class="card">${cardhead('策略收益曲线','策略 vs 固定加价基线')}<div class="legend"><span>策略毛利指数</span><span>固定加价对照</span></div>${chart()}<p class="small">模拟结果不是实盘收益。若要评估策略，需冻结样本、计入退款/拒单/退改成本，并避免未来数据泄漏。</p></div><div class="card">${cardhead('策略参数','不连接生产执行')}<div class="strategy"><b>Demand-aware pricing</b><p>按剩余座位、距起飞天数和历史转化模拟调整建议价；当前演示仅用合成需求。</p><div class="riskbox"><div><small>最大加价</small><strong>18%</strong></div><div><small>最小毛利</small><strong>¥60</strong></div><div><small>库存保护</small><strong>剩 2 座</strong></div></div></div><div class="alert" style="margin-top:12px">执行控制：策略只输出提议；订单创建必须经过人工确认。灰度、回滚和生效上限应由业务/风控配置。</div></div></section><div class="card" style="margin-top:15px">${cardhead('回测评估摘要','演示数据 · 可重复生成')}<div class="riskbox"><div><small>订单转化率</small><strong>8.7% <span class="positive">+0.6pp</span></strong></div><div><small>平均单笔毛利</small><strong>¥126 <span class="positive">+¥18</span></strong></div><div><small>拒单 / 失价率</small><strong>2.1% <span class="negative">+0.3pp</span></strong></div><div><small>取消/退款率</small><strong>4.2% <span class="small">基线 4.0%</span></strong></div><div><small>约束违规</small><strong>0</strong></div><div><small>样本有效期</small><strong>合成数据</strong></div></div></div>`}
function renderFinance(){let items=orderData(),s=stats(items);return `${pageHead('业财对账','演示订单事件 → 收入、供应商应付、渠道费用与毛利；同一订单可追溯',btn('导出对账 CSV','export','btn blue')+btn('运行差异扫描','reconcile','btn primary'))}<div class="grid stats">${metric('订单 GMV',money(s.gmv),'支付成功的模拟订单','▣')}${metric('供应商应付',money(items.reduce((a,x)=>a+x.cost,0)),'基于模拟确认成本','⇄')}${metric('渠道与支付费',money(items.reduce((a,x)=>a+x.channelCost,0)),'模拟费率','−')}${metric('订单毛利',money(s.gp),`毛利率 ${pct(s.rate)}`,'◈')}</div><div class="card">${cardhead('订单级业财明细','金额单位：CNY · Mock')}<div class="tablewrap"><table><thead><tr><th>订单</th><th>业务日期</th><th>供应商</th><th>状态</th><th>实收</th><th>供应商成本</th><th>渠道费</th><th>毛利</th><th>对账</th></tr></thead><tbody>${items.length?items.map(x=>`<tr><td>${x.id}</td><td>${x.date}</td><td>${x.offer.supplier}</td><td>${pill(x.status,x.status==='出票成功'?'good':'warn')}</td><td>${money(x.sell)}</td><td>${money(x.cost)}</td><td>${money(x.channelCost)}</td><td class="${x.margin>=0?'positive':'negative'}"><b>${money(x.margin)}</b></td><td>${pill('演示已匹配','good')}</td></tr>`).join(''):`<tr><td colspan="9" class="small">尚无订单。到“比价与定价”模拟预订一笔订单，再回来查看业财数据。</td></tr>`}</tbody></table></div></div><div class="grid threecol" style="margin-top:15px"><div class="card">${cardhead('业务事件')}<p class="small">Offer → OrderCreated → PaymentCaptured → TicketIssued<br>每个事件带订单 ID、幂等键和时间戳。</p></div><div class="card">${cardhead('财务映射')}<p class="small">客户实收 / 应收、供应商应付、渠道和支付费、毛利。演示只做管理口径，不生成法定凭证。</p></div><div class="card">${cardhead('差异控制')}<p class="small">金额/币种不一致、重复回调、出票失败、退款待结算时进入待处理队列；不静默冲账。</p></div></div>`}
function renderCopilot(){let msg=chat.length?chat:[{role:'assistant',text:'你好，我是交易 Copilot（离线演示版）。我可以基于本地模拟数据查询报价、解释定价建议、汇总订单毛利或演示供应商健康检查。\n\n当前不会调用大模型，也不会自动下单；每次回复都会展示使用了哪些数据和规则。'}];return `${pageHead('交易 Copilot','自然语言入口 + 受控工作流 · 本地规则引擎，无 Token 消耗',btn('清空会话','clear','btn'))}<section class="agent"><div class="card chat"><div class="messages" id="messages">${msg.map(m=>`<div class="msg ${m.role==='user'?'user':''}"><b>${m.role==='user'?'你':'AirBridge Copilot'}</b>${m.text}</div>`).join('')}</div><div class="chatbar"><input id="ask" class="field" placeholder="例如：PEK 到 KIX 哪个报价含行李后最划算？"><button class="btn primary" data-action="ask">分析</button></div><div class="quick"><button data-prompt="PEK 到 KIX 哪个报价含行李后最划算？">比较报价</button><button data-prompt="解释当前策略为什么推荐这个价格">解释定价</button><button data-prompt="总结当前订单和毛利情况">订单毛利</button><button data-prompt="检查供应商连接状态">供应商健康</button></div></div><aside class="card">${cardhead('本次执行轨迹','可解释规则编排')}<div class="trace" id="trace"><div><b>INPUT</b> 等待任务</div><div>Intent → Tool Router</div><div>Policy Guard → Human Confirm</div><div>Response + Source</div></div><div class="alert" style="margin-top:14px">这是确定性 Copilot demo，不是 LLM 运行结果。真实 LLM 可通过受限工具层接入，但不应获得直接改价/出票权限。</div></aside></section>`}
function render(){document.getElementById('crumb').textContent=names[page];document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===page));let html=({overview:renderOverview,supply:renderSupply,siaNdc:renderSiaNdc,pricing:renderPricing,trading:renderTrading,finance:renderFinance,copilot:renderCopilot})[page]();document.getElementById('content').innerHTML=html;bind();if(page==='siaNdc')checkSiaStatus()}
async function checkSiaStatus(){let status=document.getElementById('siaStatus');if(!status)return;try{let response=await fetch(`${siaApiBase}/api/sia/status`,{cache:'no-store'});if(!response.ok)throw new Error('API');let data=await response.json();status.textContent=data.configured?'后端已配置；仅开放 AirShopping 查询，不含订单写入。':'后端服务可用，但尚未配置新航 Sandbox 凭证和合作方信息。';status.className='alert';}catch{status.textContent='当前页面没有可用的 API 后端（GitHub Pages 仅托管静态前端）。请先按 README 在本地启动安全代理服务。';status.className='alert'}}
async function runSiaSearch(){let result=document.getElementById('siaResult'),button=document.getElementById('siaSearch');if(!result||!button)return;button.disabled=true;result.textContent='正在调用后端…';try{let response=await fetch(`${siaApiBase}/api/sia/air-shopping`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({origin:document.getElementById('siaOrigin').value,destination:document.getElementById('siaDestination').value,departureDate:document.getElementById('siaDate').value,passengers:Number(document.getElementById('siaPax').value)})});let data=await response.json();if(!response.ok)throw new Error(data.error||`请求失败 (${response.status})`);result.textContent=`Provider: ${data.provider}\nOperation: ${data.operation}\nNDC: ${data.protocolVersion}\nUpstream HTTP: ${data.upstreamStatus}\n\n${data.responseXml}`;}catch(error){result.textContent=`未取得航司响应：${error.message}\n\n未使用模拟数据替代真实结果。`}finally{button.disabled=false}}
function book(id){let o=offers.find(x=>x.id===id),cost=o.base+o.fee,sell=quote(o),channelCost=Math.round(sell*.018+18),gross=sell-cost-channelCost;if(gross<30){toast('毛利未达到安全阈值，已阻止模拟下单');return}let box=document.createElement('div');box.className='modalback';box.innerHTML=`<div class="modal"><h3>确认模拟订单</h3><p>即将为 <b>${o.airline} ${o.flight}</b> 创建本地模拟订单。当前售价 <b>${money(sell)}</b>，成本 <b>${money(cost)}</b>，渠道费 <b>${money(channelCost)}</b>，预计毛利 <b class="positive">${money(gross)}</b>。<br><br>该操作不会调用航司、扣款或出票。演示订单将进入“出票成功”状态并写入本机浏览器存储。</p><div class="modalfoot"><button class="btn" data-close>返回</button><button class="btn primary" data-confirm>确认模拟预订</button></div></div>`;document.body.append(box);box.querySelector('[data-close]').onclick=()=>box.remove();box.querySelector('[data-confirm]').onclick=()=>{orders.push({id:'AB-'+Date.now().toString().slice(-7),offerId:o.id,status:'出票成功',date:new Date().toISOString().slice(0,10),sell,cost,channelCost,margin:gross});save();box.remove();toast('模拟订单已创建，业财数据已更新');render()}}
function runAsk(text){if(!text.trim())return;chat.push({role:'user',text});let lower=text.toLowerCase(),answer,trace=[];if(/供应商|健康|连接/.test(text)){trace=['Intent=SupplierHealth','Tool=local_provider_registry','Policy=read-only'];answer='供应商探测（本地模拟）：\n'+providers.map(p=>`• ${p.name}：${p.health}，${p.latency} ms；类型 ${p.type}`).join('\n')+'\n\n数据来源：内置供应商样例。本次没有发起网络请求。'}else if(/毛利|订单|成交|财务/.test(text)){let s=stats(orderData()),items=orderData();trace=['Intent=OrderMarginSummary','Tool=local_order_ledger','Policy=read-only'];answer=`本地演示订单 ${s.booked} 笔，GMV ${money(s.gmv)}，估算毛利 ${money(s.gp)}（${pct(s.rate)}）。\n${items.length?items.map(o=>`• ${o.id}：${o.offer.route}，毛利 ${money(o.margin)}`).join('\n'):'目前还没有模拟订单。可到“比价与定价”创建一笔。'}\n\n口径：售价 − 模拟供应成本 − 渠道费；不是结算账单。`}else if(/解释|策略|价格|定价/.test(text)){trace=['Intent=PricingExplanation','Tool=deterministic_pricing_rule','Policy=below-cost-block + margin-floor'];answer=`当前为“${strategy==='balanced'?'平衡':strategy==='volume'?'走量':'毛利优先'}”策略，目标毛利旋钮 ${margin}%。建议售价按“含费成本 × 策略系数 + 交易缓冲”计算；当前仅生成建议，不修改供应商报价。\n\n该规则是演示用启发式，不是学习得到的最优策略；生产策略需用冻结样本做离线回测，再小流量验证。`}else{let o=[...offers].sort((a,b)=>(a.base+a.fee)-(b.base+b.fee))[0];trace=['Intent=CompareOffers','Tool=normalized_mock_offers','Policy=compare_total_cost + baggage'];answer=`当前最便宜的基础报价是 ${o.airline} ${o.flight}（${o.supplier}），基础价 ${money(o.base)} + 税费 ${money(o.fee)} = 含费 ${money(o.base+o.fee)}，行李：${o.baggage}。\n\n按含费总价排序：\n${[...offers].sort((a,b)=>a.base+a.fee-b.base-b.fee).map(x=>`• ${x.airline} ${x.flight}：${money(x.base+x.fee)}，行李 ${x.baggage}，${x.refundable?'可退':'不可退'}`).join('\n')}\n\n数据来自本地模拟样例，非实时票价；下单前应重新询价。`}chat.push({role:'assistant',text:answer});render();let tr=document.getElementById('trace');if(tr)tr.innerHTML=trace.map((x,i)=>`<div><b>${i===0?'INPUT':i===1?'TOOL':'GUARD'}</b> ${x}</div>`).join('')}
function exportData(){let data=page==='finance'?orderData():page==='supply'?providers:page==='trading'?{strategy,margin,baseline:'synthetic',live_execution:false}:offers.map(o=>({...o,cost:o.base+o.fee,suggested_price:quote(o)}));let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`airbridge-${page}-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);toast('演示数据已导出 JSON')}
function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let a=b.dataset.action;if(a.startsWith('book:'))book(a.slice(5));else if(a==='refresh'){offers=structuredClone(baseOffers);toast('已载入本地模拟报价');render()}else if(a==='health'){toast('模拟探测完成：2 正常，1 延迟偏高');}else if(a==='recommend'){toast('已按当前策略刷新建议价');render()}else if(a==='export')exportData();else if(a==='backtest'){toast('回测完成：使用内置合成样例，不代表真实收益');}else if(a==='reconcile'){toast('差异扫描完成：模拟订单均匹配');}else if(a==='ask'){let input=document.getElementById('ask'),value=input.value;input.value='';runAsk(value)}else if(a==='clear'){chat=[];render()}else if(a==='sia-search')runSiaSearch();else if(a==='sia-status')checkSiaStatus()});document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>runAsk(b.dataset.prompt));let st=document.getElementById('strategy');if(st)st.onchange=()=>{strategy=st.value;render()};let m=document.getElementById('margin');if(m){m.oninput=()=>{document.getElementById('margindisplay').textContent=m.value+'%'};m.onchange=()=>{margin=Number(m.value);render()}}let input=document.getElementById('ask');if(input)input.onkeydown=e=>{if(e.key==='Enter')document.querySelector('[data-action=ask]').click()}}
document.getElementById('nav').onclick=e=>{let b=e.target.closest('button[data-page]');if(b){page=b.dataset.page;render()}};render();
</script>
